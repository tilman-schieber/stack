# Build the web version and publish it to GitHub Pages on every push to main.
# Enable Pages for the repository with "Source: GitHub Actions" once.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips the Electron download and the native SQLite
      # build; neither is needed for the web bundle.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
